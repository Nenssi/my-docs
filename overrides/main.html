{% block scripts %}
    {{ super() }}
    <style>
        /* Отменяем полноэкранный режим для всего тела виджета */
        html.__cb_widget_active, 
        html.__cb_widget_active body {
            position: static !important;
            overflow: auto !important;
            width: auto !important;
            height: auto !important;
        }

        /* Ограничиваем главное внешнее окно виджета Chatbase */
        #chatbase-bubble-window,
        div[id="chatbase-bubble-window"] {
            width: 380px !important;
            height: 540px !important;
            max-height: 80vh !important;
            max-width: 90vw !important;
            position: fixed !important;
            bottom: 90px !important;
            right: 20px !important;
            border-radius: 16px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2) !important;
        }

        /* Принудительно сжимаем iframe внутри этого окна */
        #chatbase-bubble-window iframe,
        div[id="chatbase-bubble-window"] iframe {
            width: 100% !important;
            height: 100% !important;
            border-radius: 16px !important;
        }
    </style>
    
    <!-- Твой оригинальный рабочий скрипт из Chatbase ниже -->
     <script>
(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="WWMPwUAKkUyCGWGnK1lmz";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
</script>
